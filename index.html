<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Inventario</title>
    <script src="./js/Producto.js"></script>

  <body>
    <div id="app">
      <form>
        <label> Código
          <input type="number" id="txtCod" value="0">

        <div></div>

        <label> Nombre
          <input type="text" id="txtNom">
        </label>
        <div></div>

        <label> Cantidad
          <input type="number" id="txtCan">
        </label>
        <div></div>

        <label> Precio
          <input type="number" id="txtPre">

        <div></div>

        <label> Posición

        </label>

        <button type="button" id="btnList">Listar</button>
        <button type="button" id="btnListInverso">Listar Inverso</button>

      <div id="detalles"></div>
